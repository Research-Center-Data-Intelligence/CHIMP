<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Annotate Image</title>
  <style>
    body {
      margin: 24px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #1f2937;
      background: #f8fafc;
    }

    .topbar {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .button {
      display: inline-block;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 8px 12px;
      background: #fff;
      color: #111827;
      text-decoration: none;
      cursor: pointer;
      font-size: 14px;
    }

    .button:hover {
      background: #f8fafc;
    }

    .status {
      font-size: 14px;
      color: #4b5563;
    }

    .error {
      color: #b91c1c;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr);
      gap: 16px;
      align-items: start;
    }

    .panel {
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
      padding: 12px;
    }

    .stage {
      position: relative;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      overflow: hidden;
      background: #f3f4f6;
      user-select: none;
    }

    .stage img {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      cursor: crosshair;
    }

    .marker {
      position: absolute;
      width: 22px;
      height: 22px;
      margin-left: -11px;
      margin-top: -11px;
      border-radius: 999px;
      background: #f59e0b;
      color: #111827;
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      pointer-events: none;
    }

    .kps {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      max-height: 520px;
      overflow: auto;
    }

    .kp {
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 8px 10px;
      background: #fff;
      color: #111827;
      cursor: pointer;
      text-align: left;
      font-size: 12px;
    }

    .kp.active {
      border-color: #2563eb;
      box-shadow: inset 0 0 0 1px #2563eb;
    }

    .kp.done {
      background: #ecfdf5;
    }

    .meta {
      font-size: 13px;
      color: #4b5563;
      line-height: 1.4;
      margin-top: 8px;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="button" href="/">Back to list</a>
    <button id="refreshBtn" class="button" type="button">Reload image</button>
    <span id="status" class="status">Loading…</span>
  </div>

  <h1>Annotate image</h1>
  <div id="details" class="meta"></div>

  <div class="layout" style="margin-top: 16px;">
    <div class="panel">
      <div class="stage">
        <img id="annotateImage" alt="Image to annotate" />
        <div id="overlay" class="overlay"></div>
      </div>
    </div>

    <div class="panel">
      <h2>COCO keypoints</h2>
      <div id="instruction" class="meta"></div>
      <div id="progress" class="meta"></div>
      <div id="currentPoint" class="meta"></div>
      <div id="keypoints" class="kps" style="margin-top: 12px;"></div>
      <div class="controls">
        <button id="undoBtn" class="button" type="button">Undo last</button>
        <button id="clearBtn" class="button" type="button">Clear all</button>
        <button id="saveBtn" class="button" type="button">Save</button>
      </div>
    </div>
  </div>

  <script>
    window.__DATAPOINT_ID__ = {{ datapoint_id | tojson }};
  </script>
  <script src="/static/js/annotate.js"></script>
</body>
</html>
