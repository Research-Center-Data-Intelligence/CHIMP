<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HPE / YOLO Pose Labeling</title>
  <style>
    body {
      margin: 24px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #1f2937;
      background: #f8fafc;
    }

    .row {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }

    .card {
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
      padding: 10px;
    }

    .card img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 6px;
      background: #f3f4f6;
      cursor: pointer;
    }

    .meta {
      font-size: 12px;
      color: #4b5563;
      margin-top: 8px;
      word-break: break-word;
      line-height: 1.4;
    }

    .button {
      display: inline-block;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 8px 12px;
      background: #fff;
      color: #111827;
      text-decoration: none;
      cursor: pointer;
      font-size: 14px;
    }

    .button:hover {
      background: #f8fafc;
    }

    .status {
      font-size: 14px;
      color: #4b5563;
    }

    .error {
      color: #b91c1c;
    }
  </style>
</head>
<body>
  <div class="row">
    <h1 style="margin: 0; font-size: 24px;">HPE / YOLO Pose Labeling</h1>
    <button id="refreshBtn" class="button" type="button">Refresh</button>
    <span id="status" class="status">Loading…</span>
  </div>
  <div id="grid" class="grid"></div>

  <script src="/static/js/labeling.js"></script>
</body>
</html>
